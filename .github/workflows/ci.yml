name: build-and-boundaries
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 script encoding and syntax
        run: python scripts/check-powershell.py
      - name: Offline publisher encoding and resume checks
        shell: powershell
        run: python scripts/test-publisher.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          targets: x86_64-pc-windows-gnu
          components: rustfmt
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils
          path-type: inherit
      - name: Add the MSVCRT MinGW toolchain
        shell: msys2 {0}
        run: cygpath -w /mingw64/bin >> "$GITHUB_PATH"
      - name: Unit and boundary tests (failures are never skipped)
        shell: powershell
        run: cargo +stable-x86_64-pc-windows-gnu test --locked --lib --target x86_64-pc-windows-gnu
      - name: Build release and audit imports
        shell: powershell
        run: ./scripts/build.ps1
      - name: Six-language CLI and native GUI checks
        run: python scripts/smoke.py --cli target/x86_64-pc-windows-gnu/release/fp.exe --gui target/x86_64-pc-windows-gnu/release/freeport.exe
      - name: Build fault-injection executable
        shell: powershell
        run: ./scripts/build.ps1 -Profile dev
      - name: Real NTFS, cross-volume, crash recovery and GUI flow
        shell: powershell
        run: ./scripts/test-native.ps1 -Cli target/x86_64-pc-windows-gnu/debug/fp.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-evidence
          # .build starts with a dot; upload-artifact skips hidden paths unless told otherwise.
          include-hidden-files: true
          path: |
            .build/*result.json
            .build/pe-audit.json
            .build/native-acceptance.json
            .build/gui-e2e.json
      # No automatic release: VM power-loss evidence and the real-application rehearsal are separate gates.
