[package]
name = "freeport"
version = "1.0.0"
edition = "2021"
description = "Windows directory migration with reversible NTFS junctions"

[lib]
name = "freeport"
path = "src/lib.rs"

[[bin]]
name = "fp"
path = "src/main.rs"

[[bin]]
name = "freeport"
path = "src/gui.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
junction = "1.4"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_Ioctl", "Win32_System_IO", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_RestartManager", "Win32_NetworkManagement_NetManagement", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"
